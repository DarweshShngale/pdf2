<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مترجم المستندات البسيط</title>
    <!-- شيت PDF.js لقراءة ملفات PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <!-- مكتبة Mammoth.js لقراءة ملفات DOCX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.5.0/mammoth.browser.min.js"></script>
    <script>
        // تعيين مسار العامل لمكتبة PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    </script>
    <style>
        :root {
            --primary-color: #4285f4;
            --secondary-color: #34a853;
            --accent-color: #fbbc05;
            --error-color: #ea4335;
            --white: #ffffff;
            --light-gray: #f5f5f5;
            --dark-gray: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-gray);
            color: var(--dark-gray);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--white);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 30px;
        }

        .file-upload {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            border: 2px dashed var(--primary-color);
            border-radius: 10px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .file-upload:hover {
            border-color: var(--secondary-color);
            background-color: rgba(66, 133, 244, 0.05);
        }

        .file-upload-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            width: 100%;
        }

        .file-upload-icon {
            font-size: 40px;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        #file-upload {
            display: none;
        }

        .file-info {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        .language-selectors {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .language-select {
            flex: 1;
            margin: 0 10px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--dark-gray);
        }

        select, button, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea {
            min-height: 150px;
            max-height: 300px;
            resize: vertical;
        }

        select:focus, textarea:focus {
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #3367d6;
        }

        button:disabled {
            background-color: #b8b8b8;
            cursor: not-allowed;
        }

        .result-container {
            margin-top: 30px;
            border-top: 1px solid #ddd;
            padding-top: 20px;
        }

        .result-text {
            background-color: var(--light-gray);
            padding: 20px;
            border-radius: 5px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            min-height: 150px;
        }

        .spinner {
            display: none;
            width: 40px;
            height: 40px;
            margin: 20px auto;
            border: 4px solid rgba(66, 133, 244, 0.3);
            border-radius: 50%;
            border-top: 4px solid var(--primary-color);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            color: var(--error-color);
            text-align: center;
            margin: 10px 0;
            display: none;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: #ddd;
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
        }

        .tab-container {
            display: flex;
            border-bottom: 1px solid #ddd;
            margin-bottom: 20px;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: 5px 5px 0 0;
            background-color: #f1f1f1;
            margin-right: 5px;
        }

        .tab.active {
            background-color: var(--white);
            border-color: #ddd;
            border-bottom: 1px solid var(--white);
            margin-bottom: -1px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        #api-key-input {
            font-family: monospace;
        }

        .btn-small {
            padding: 5px 10px;
            font-size: 14px;
            margin-top: 5px;
        }

        .flex-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .api-info {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>مترجم المستندات</h1>
        
        <!-- أزرار التبويب -->
        <div class="tab-container">
            <div class="tab active" data-tab="file-upload-tab">تحميل ملف</div>
            <div class="tab" data-tab="manual-tab">إدخال نص يدوي</div>
            <div class="tab" data-tab="settings-tab">الإعدادات</div>
        </div>
        
        <!-- تبويب تحميل الملف -->
        <div class="tab-content active" id="file-upload-tab">
            <!-- منطقة رفع الملف -->
            <div class="file-upload" id="drop-area">
                <label for="file-upload" class="file-upload-label">
                    <div class="file-upload-icon">📄</div>
                    <span>اضغط هنا لاختيار ملف أو اسحب الملف وأفلته هنا</span>
                    <input type="file" id="file-upload" accept=".pdf,.docx,.txt">
                </label>
                <div class="file-info" id="file-info">لم يتم اختيار ملف</div>
            </div>
            
            <button id="extract-text-btn" disabled>استخراج النص من الملف</button>
            
            <!-- شريط التقدم -->
            <div class="progress-bar-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            
            <div class="error-message" id="extraction-error"></div>
            
            <div class="result-container" id="extracted-container" style="display: none;">
                <h2>النص المستخرج</h2>
                <textarea id="extracted-text" placeholder="سيظهر النص المستخرج هنا..."></textarea>
            </div>
        </div>
        
        <!-- تبويب الإدخال اليدوي -->
        <div class="tab-content" id="manual-tab">
            <div class="input-group">
                <label for="manual-text">أدخل النص للترجمة:</label>
                <textarea id="manual-text" placeholder="أدخل النص الذي تريد ترجمته هنا..."></textarea>
            </div>
        </div>
        
        <!-- تبويب الإعدادات -->
        <div class="tab-content" id="settings-tab">
            <div class="input-group">
                <label for="api-key-input">مفتاح Google Gemini API:</label>
                <div class="flex-row">
                    <input type="password" id="api-key-input" value="AIzaSyD0oNrn38aRwdMZ35oOpnF9h7seuj--8co">
                    <button class="btn-small" id="show-api-key">عرض</button>
                </div>
                <div class="api-info">إذا واجهت مشاكل في الترجمة، يمكنك الحصول على مفتاح API الخاص بك من <a href="https://ai.google.dev/" target="_blank">https://ai.google.dev/</a></div>
            </div>
            
            <div class="input-group">
                <label for="api-model">نموذج API:</label>
                <select id="api-model">
                    <option value="gemini-pro">Gemini Pro (الأكثر استقراراً)</option>
                    <option value="gemini-1.0-pro">Gemini 1.0 Pro</option>
                    <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                </select>
            </div>
            
            <div class="input-group">
                <label for="max-chars">الحد الأقصى للأحرف للترجمة:</label>
                <select id="max-chars">
                    <option value="1000">1000 حرف</option>
                    <option value="2000">2000 حرف</option>
                    <option value="5000" selected>5000 حرف</option>
                    <option value="10000">10000 حرف</option>
                    <option value="20000">20000 حرف</option>
                </select>
            </div>
        </div>
        
        <div class="input-group" style="margin-top: 20px;">
            <div class="language-selectors">
                <div class="language-select">
                    <label for="source-language">اللغة الأصلية:</label>
                    <select id="source-language">
                        <option value="en">الإنجليزية</option>
                        <option value="ar" selected>العربية</option>
                        <option value="fr">الفرنسية</option>
                        <option value="es">الإسبانية</option>
                        <option value="de">الألمانية</option>
                        <option value="it">الإيطالية</option>
                        <option value="ru">الروسية</option>
                        <option value="zh">الصينية</option>
                        <option value="ja">اليابانية</option>
                        <option value="ko">الكورية</option>
                        <option value="pt">البرتغالية</option>
                        <option value="tr">التركية</option>
                    </select>
                </div>
                <div class="language-select">
                    <label for="target-language">اللغة المستهدفة:</label>
                    <select id="target-language">
                        <option value="en" selected>الإنجليزية</option>
                        <option value="ar">العربية</option>
                        <option value="fr">الفرنسية</option>
                        <option value="es">الإسبانية</option>
                        <option value="de">الألمانية</option>
                        <option value="it">الإيطالية</option>
                        <option value="ru">الروسية</option>
                        <option value="zh">الصينية</option>
                        <option value="ja">اليابانية</option>
                        <option value="ko">الكورية</option>
                        <option value="pt">البرتغالية</option>
                        <option value="tr">التركية</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- زر الترجمة -->
        <button id="translate-btn">ترجمة النص</button>
        
        <!-- دائرة التحميل -->
        <div class="spinner" id="spinner"></div>
        
        <!-- رسالة الخطأ -->
        <div class="error-message" id="error-message"></div>
        
        <!-- نتيجة الترجمة -->
        <div class="result-container" id="result-container">
            <h2>النص المترجم</h2>
            <div class="result-text" id="result-text" contenteditable="true"></div>
            <button id="download-btn">تحميل النص المترجم</button>
            <button id="copy-btn">نسخ النص المترجم</button>
        </div>
    </div>

    <script>
        // متغيرات عامة
        let extractedText = '';
        let translatedText = '';
        let fileName = '';
        let fileExtension = '';
        
        // العناصر في الصفحة
        const fileUpload = document.getElementById('file-upload');
        const fileInfo = document.getElementById('file-info');
        const dropArea = document.getElementById('drop-area');
        const extractTextBtn = document.getElementById('extract-text-btn');
        const translateBtn = document.getElementById('translate-btn');
        const downloadBtn = document.getElementById('download-btn');
        const copyBtn = document.getElementById('copy-btn');
        const resultContainer = document.getElementById('result-container');
        const resultText = document.getElementById('result-text');
        const extractedContainer = document.getElementById('extracted-container');
        const extractedTextArea = document.getElementById('extracted-text');
        const manualTextArea = document.getElementById('manual-text');
        const sourceLanguage = document.getElementById('source-language');
        const targetLanguage = document.getElementById('target-language');
        const spinner = document.getElementById('spinner');
        const errorMessage = document.getElementById('error-message');
        const extractionError = document.getElementById('extraction-error');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const apiKeyInput = document.getElementById('api-key-input');
        const showApiKeyBtn = document.getElementById('show-api-key');
        const apiModel = document.getElementById('api-model');
        const maxChars = document.getElementById('max-chars');
        const tabs = document.querySelectorAll('.tab');
        const tabContents = document.querySelectorAll('.tab-content');
        
        // ----------------------
        // وظائف التبويب
        // ----------------------
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const tabId = tab.getAttribute('data-tab');
                
                // إزالة الفئة النشطة من جميع علامات التبويب والمحتويات
                tabs.forEach(t => t.classList.remove('active'));
                tabContents.forEach(c => c.classList.remove('active'));
                
                // إضافة الفئة النشطة إلى التبويب المحدد ومحتواه
                tab.classList.add('active');
                document.getElementById(tabId).classList.add('active');
            });
        });
        
        // ----------------------
        // أحداث رفع الملف
        // ----------------------
        fileUpload.addEventListener('change', handleFileSelect);
        extractTextBtn.addEventListener('click', handleExtractText);
        
        // مستمعات لمنطقة السحب والإفلات
        dropArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropArea.style.borderColor = 'var(--secondary-color)';
            dropArea.style.backgroundColor = 'rgba(66, 133, 244, 0.1)';
        });
        
        dropArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropArea.style.borderColor = 'var(--primary-color)';
            dropArea.style.backgroundColor = '';
        });
        
        dropArea.addEventListener('drop', (e) => {
            e.preventDefault();
            dropArea.style.borderColor = 'var(--primary-color)';
            dropArea.style.backgroundColor = '';
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileUpload.files = files;
                handleFileSelect();
            }
        });
        
        // ----------------------
        // أحداث الترجمة
        // ----------------------
        translateBtn.addEventListener('click', translateText);
        downloadBtn.addEventListener('click', downloadTranslatedText);
        copyBtn.addEventListener('click', copyTranslatedText);
        
        // زر إظهار/إخفاء مفتاح API
        showApiKeyBtn.addEventListener('click', () => {
            if (apiKeyInput.type === 'password') {
                apiKeyInput.type = 'text';
                showApiKeyBtn.textContent = 'إخفاء';
            } else {
                apiKeyInput.type = 'password';
                showApiKeyBtn.textContent = 'عرض';
            }
        });
        
        /**
         * معالجة حدث تحديد الملف
         */
        function handleFileSelect() {
            // إعادة تعيين الحالة
            extractedContainer.style.display = 'none';
            extractedTextArea.value = '';
            extractionError.style.display = 'none';
            
            const file = fileUpload.files[0];
            if (!file) return;
            
            // التحقق من حجم الملف (الحد الأقصى 10 ميجابايت)
            const MAX_FILE_SIZE = 10 * 1024 * 1024;
            if (file.size > MAX_FILE_SIZE) {
                showExtractionError('حجم الملف كبير جدًا. الحد الأقصى هو 10 ميجابايت.');
                fileUpload.value = '';
                fileInfo.textContent = 'لم يتم اختيار ملف';
                extractTextBtn.disabled = true;
                return;
            }
            
            // تحديث معلومات الملف
            fileName = file.name.split('.').slice(0, -1).join('.');
            fileExtension = file.name.split('.').pop().toLowerCase();
            fileInfo.textContent = `الملف: ${file.name} (${formatFileSize(file.size)})`;
            extractTextBtn.disabled = false;
        }
        
        /**
         * تنسيق حجم الملف
         */
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' بايت';
            else if (bytes < 1048576) return (bytes / 1024).toFixed(2) + ' كيلوبايت';
            else return (bytes / 1048576).toFixed(2) + ' ميجابايت';
        }
        
        /**
         * استخراج النص من الملف
         */
        async function handleExtractText() {
            try {
                const file = fileUpload.files[0];
                if (!file) {
                    showExtractionError('الرجاء اختيار ملف أولاً');
                    return;
                }
                
                // إظهار شريط التقدم وإعادة تعيين رسائل الخطأ
                progressContainer.style.display = 'block';
                progressBar.style.width = '10%';
                extractionError.style.display = 'none';
                
                // استخراج النص حسب نوع الملف
                try {
                    switch (fileExtension) {
                        case 'pdf':
                            extractedText = await extractTextFromPdf(file);
                            break;
                        case 'docx':
                            extractedText = await extractTextFromDocx(file);
                            break;
                        case 'txt':
                            extractedText = await extractTextFromTxt(file);
                            break;
                        default:
                            throw new Error('نوع الملف غير مدعوم');
                    }
                    
                    // عرض النص المستخرج
                    extractedTextArea.value = extractedText;
                    extractedContainer.style.display = 'block';
                    
                    // نسخ النص إلى مربع النص اليدوي أيضًا للتبديل السهل
                    manualTextArea.value = extractedText;
                    
                    // إخفاء شريط التقدم بعد لحظة
                    setTimeout(() => {
                        progressContainer.style.display = 'none';
                        progressBar.style.width = '0%';
                    }, 500);
                    
                } catch (error) {
                    console.error('خطأ في استخراج النص:', error);
                    showExtractionError(`فشل استخراج النص: ${error.message}`);
                    progressContainer.style.display = 'none';
                }
                
            } catch (error) {
                console.error('خطأ غير متوقع:', error);
                showExtractionError('حدث خطأ غير متوقع أثناء معالجة الملف');
                progressContainer.style.display = 'none';
            }
        }
        
        /**
         * استخراج النص من ملف PDF
         */
        async function extractTextFromPdf(file) {
            try {
                const arrayBuffer = await readFileAsArrayBuffer(file);
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let text = '';
                
                // استخراج النص من كل صفحة
                for (let i = 1; i <= pdf.numPages; i++) {
                    progressBar.style.width = `${10 + (80 * i / pdf.numPages)}%`;
                    
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    const pageText = content.items.map(item => item.str).join(' ');
                    text += pageText + '\n\n';
                }
                
                return text;
                
            } catch (error) {
                console.error('خطأ في استخراج النص من PDF:', error);
                throw new Error('فشل في استخراج النص من ملف PDF');
            }
        }
        
        /**
         * استخراج النص من ملف DOCX
         */
        async function extractTextFromDocx(file) {
            try {
                progressBar.style.width = '50%';
                
                const arrayBuffer = await readFileAsArrayBuffer(file);
                const result = await mammoth.extractRawText({ arrayBuffer });
                
                progressBar.style.width = '90%';
                return result.value;
                
            } catch (error) {
                console.error('خطأ في استخراج النص من DOCX:', error);
                throw new Error('فشل في استخراج النص من ملف DOCX');
            }
        }
        
        /**
         * استخراج النص من ملف TXT
         */
        async function extractTextFromTxt(file) {
            try {
                progressBar.style.width = '50%';
                const text = await readFileAsText(file);
                progressBar.style.width = '90%';
                return text;
                
            } catch (error) {
                console.error('خطأ في استخراج النص من TXT:', error);
                throw new Error('فشل في استخراج النص من ملف TXT');
            }
        }
        
        /**
         * قراءة الملف كـ ArrayBuffer
         */
        function readFileAsArrayBuffer(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }
        
        /**
         * قراءة الملف كنص
         */
        function readFileAsText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }
        
        /**
         * ترجمة النص
         */
        async function translateText() {
            try {
                // تحديد النص المصدر (إما من النص المستخرج أو النص اليدوي)
                let sourceText = '';
                const activeTab = document.querySelector('.tab.active').getAttribute('data-tab');
                
                if (activeTab === 'file-upload-tab') {
                    sourceText = extractedTextArea.value.trim();
                } else if (activeTab === 'manual-tab') {
                    sourceText = manualTextArea.value.trim();
                }
                
                if (!sourceText) {
                    showError('الرجاء إدخال النص أو استخراج النص من ملف أولاً');
                    return;
                }
                
                // إخفاء أي أخطاء سابقة وإظهار المؤشر الدوار
                errorMessage.style.display = 'none';
                spinner.style.display = 'block';
                translateBtn.disabled = true;
                
                // تقليص النص إذا كان طويلاً جدًا
                const maxCharsValue = parseInt(maxChars.value);
                const textToTranslate = sourceText.length > maxCharsValue 
                    ? sourceText.substring(0, maxCharsValue) + '...'
                    : sourceText;
                
                console.log(`ترجمة ${textToTranslate.length} حرف...`);
                
                // الحصول على قيم اللغة المصدر والهدف
                const source = sourceLanguage.value;
                const target = targetLanguage.value;
                
                // صياغة طلب الترجمة
                const prompt = `Translate the following text from ${getLanguageName(source)} to ${getLanguageName(target)}. Return ONLY the translated text:

${textToTranslate}`;
                
                // استخدام Gemini API للترجمة
